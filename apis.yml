aid: jitjatjo
name: Jitjatjo
description: >-
  Jitjatjo is a New York City based on-demand staffing and workforce management platform
  operated by JJJ International, matching hospitality, healthcare, education, facilities,
  retail and logistics businesses with W2 temporary talent in real time. The company runs
  two consumer-facing products — "Ondemand by Jitjatjo" for businesses booking shifts and
  "Flex by Jitjatjo" for talent picking up gigs — alongside "Network", a frontline vendor
  management system (VMS) for contingent labor that is integrated with SAP Fieldglass.
  JJJ International was acquired by Dayforce in September 2025 and the platform is being
  rebranded as Dayforce Flex Work; the Jitjatjo web apps now call API hosts on
  dayforceflexwork.com. Jitjatjo publishes no public developer program: no developer
  portal, API reference, OpenAPI/GraphQL contract, SDK or webhook catalog was found on any
  host the company controls.
