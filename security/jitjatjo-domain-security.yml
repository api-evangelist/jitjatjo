source: live DNS/TLS/HTTP probes of apis.yml + production API hosts, 2026-08-23
note: >-
  The headline finding is that the canonical marketing site is DOWN over HTTPS.
  www.jitjatjo.com resolves to the Webflow edge (proxy-ssl.webflow.com) and that
  edge aborts the TLS handshake with alert 40 (handshake_failure) on all three
  of its IPs and at every offered TLS version, so no HTTPS request completes at
  all. The apex jitjatjo.com 301s to it, and news.jitjatjo.com and
  www.networkplatform.com sit behind the same Webflow edge with the same
  failure. The Internet Archive's last successful capture of the site is
  2026-06-08, which brackets when it broke. The product hosts are healthy —
  the CloudFront apps and the production API host all negotiate TLS cleanly and
  the API host sets HSTS.
hosts:
